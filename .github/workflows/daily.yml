name: Daily edition

on:
  schedule:
    # Two slots so exactly one equals 05:00 Europe/Lisbon across DST:
    # 04:00 UTC = 05:00 WEST (summer) | 05:00 UTC = 05:00 WET (winter)
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Time guard (05:00 Europe/Lisbon)
        id: guard
        run: |
          set +e
          python scripts/guard.py
          code=$?
          if [ "$code" = "78" ]; then echo "run=false" >> "$GITHUB_OUTPUT";
          elif [ "$code" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT";
          else exit "$code"; fi

      - name: Fetch news and papers
        if: steps.guard.outputs.run == 'true'
        run: python scripts/fetch_sources.py

      - name: Compose edition (Mistral)
        if: steps.guard.outputs.run == 'true'
        run: python scripts/compose.py
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Render web + email editions
        if: steps.guard.outputs.run == 'true'
        run: python scripts/render.py

      - name: Send email edition
        if: steps.guard.outputs.run == 'true'
        run: python scripts/send.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Publish web edition
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "green-herald-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || (git commit -m "Edition $(date -u +%F)" && git push)
