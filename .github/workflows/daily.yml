name: Daily edition

on:
  schedule:
    # GitHub's free-tier scheduler delays triggers unpredictably (observed:
    # 6-9 hours). Dense scheduling: fire every 30 minutes and let the time
    # guard decide - triggers landing 05:00-11:59 Lisbon print the edition
    # (catch-up), the rest skip in ~6s. Skipped runs are free on public repos.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Time guard (05:00 Europe/Lisbon)
        id: guard
        env:
          GUARD_BYPASS: ${{ vars.GUARD_BYPASS }}
        run: |
          set +e
          python scripts/guard.py
          code=$?
          if [ "$code" = "78" ]; then echo "run=false" >> "$GITHUB_OUTPUT";
          elif [ "$code" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT";
          else exit "$code"; fi

      - name: Fetch news and papers
        if: steps.guard.outputs.run == 'true'
        run: python scripts/fetch_sources.py

      - name: Compose edition (Mistral)
        if: steps.guard.outputs.run == 'true'
        run: python scripts/compose.py
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Render web + email editions
        if: steps.guard.outputs.run == 'true'
        run: python scripts/render.py

      - name: Send email edition
        if: steps.guard.outputs.run == 'true'
        run: python scripts/send.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBERS: ${{ vars.SUBSCRIBERS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Publish web edition
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "green-herald-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ data/
          if ! git diff --cached --quiet; then
            git commit -m "Edition $(date -u +%F)"
            git pull --rebase -X theirs origin main
            git push
          fi
