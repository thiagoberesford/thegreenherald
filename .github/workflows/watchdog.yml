name: Edition watchdog

on:
  schedule:
    # ~12:30 Lisbon in summer (WEST); 11:30 in winter - both after the
    # catch-up window closes at noon, so only genuinely missed editions alert
    - cron: "30 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check today's edition exists
        run: python scripts/watchdog.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          SUBSCRIBERS: ${{ vars.SUBSCRIBERS }}
