name: Edition watchdog

on:
  schedule:
    # Hourly from ~12:30 Lisbon (summer). The scheduler delays triggers, so
    # this is dense: the first run to land after a missed edition alerts and
    # commits a dedupe marker; later runs see the marker and stay silent.
    - cron: "30 11-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check today's edition exists
        run: python scripts/watchdog.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          SUBSCRIBERS: ${{ vars.SUBSCRIBERS }}
